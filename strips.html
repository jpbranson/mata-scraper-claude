<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATA route strips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="pages.css">
<style>
  #top { margin: 14px; }
  main { padding: 0 16px 40px; }
  h1 { font-size: 24px; font-weight: 600; margin: 8px 0 4px; }
  h1 .chip { cursor: default; margin-right: 8px; }
  #strips { display: flex; flex-wrap: wrap; gap: 28px 40px; margin-top: 16px; }
  .col h2 { font-size: 18px; font-weight: 600; margin: 0; }
  .col svg { display: block; margin-top: 8px; overflow: visible; }
  .col svg text { font: 16px Inter, system-ui, sans-serif; }
  .col .stop { fill: var(--ink-2); }
  .col .tp { fill: var(--ink); font-weight: 600; }
  .col .lab { fill: var(--ink); font-weight: 600; }
  .col .lab2 { fill: var(--muted); }
</style>
</head>
<body>
<header id="top" class="panel">
  <nav><a href="map.html">Map</a><a href="strips.html" class="on">Strips</a><a href="schematic.html">Schematic</a></nav>
  <div id="clock"><i></i><span>–</span></div>
  <div class="chips" id="routes" style="flex-basis: 100%"></div>
</header>
<main>
  <h1 id="title"></h1>
  <div class="key">
    <span><i style="background:var(--early)"></i>early</span>
    <span><i style="background:var(--ontime)"></i>on time</span>
    <span><i style="background:var(--late5)"></i>5+ min late</span>
    <span><i style="background:var(--late10)"></i>10+ min late</span>
    <span><i style="background:var(--late20)"></i>20+ min late</span>
    <span><i style="border:2px dashed var(--muted);width:9px;height:9px"></i>no GPS movement</span>
    <span>&#9679; big dot = major (timed) stop</span>
  </div>
  <div id="strips"></div>
  <p id="off" class="muted"></p>
</main>
<script src="transit.js"></script>
<script>
// One strip per direction (headsign) of the chosen route, stops top to
// bottom in travel order, evenly spaced, with the live buses on the line.
// Each bus is placed between its previous and next stop by distance; its
// label gives the gap to the bus ahead (down the strip) in scheduled minutes, so
// bunching and gaps read at a glance. Route in the URL hash (strips.html#36).
const ROW = 26, TOP = 14;
let routes = [], latest = null, render_ = 0;
const chosen = () => location.hash.slice(1) || routes[0]?.id;

fetch("routes.csv", { cache: "no-cache" }).then(r => r.text()).then(t => {
  routes = t.trim().split("\n").slice(1).map(l => l.split(","))
    .map(c => ({ id: c[1], name: c[2] })).sort((a, b) => +a.id - +b.id);
  draw();
});
addEventListener("hashchange", draw);
addEventListener("resize", draw);
followLive((j) => { latest = j; draw(); });

function draw() {
  if (!routes.length) return;
  const count = {};
  for (const v of latest?.vehicles ?? []) count[v.route_id] = (count[v.route_id] ?? 0) + 1;
  const cur = chosen();
  $("routes").innerHTML = routes.map(r =>
    `<button class="chip${r.id === cur ? " on" : ""}" data-r="${esc(r.id)}" title="${esc(r.name)}">${esc(r.id)}<small>${count[r.id] ?? 0}</small></button>`).join("");
  for (const b of $("routes").children) b.onclick = () => { location.hash = b.dataset.r; };
  const r = routes.find(x => x.id === cur);
  $("title").innerHTML = `<span class="chip on">${esc(cur)}</span>${esc(r?.name ?? "")}`;
  renderStrips(cur);
}

async function renderStrips(route) {
  if (!latest) return;
  const token = ++render_;
  const file = await routeFile(latest.day, route);
  if (token !== render_) return;
  const pats = file?.patterns;
  if (!pats?.length) {
    $("strips").innerHTML = `<p class="muted">${file ? "No stop patterns in today's timetable file. Restart the poller (ops\\update.ps1) to write them."
      : "No timetable for this route today."}</p>`;
    $("off").textContent = "";
    return;
  }
  const placed = pats.map(() => []), off = [];
  for (const v of latest.vehicles) if (v.route_id === route) {
    const at = locate(v, pats);
    if (at) placed[at.pat].push({ v, pos: at.pos }); else off.push(v);
  }
  const W = Math.min(480, $("strips").clientWidth || 480);
  const order = pats.map((p, i) => i).sort((a, b) => pats[a].dir.localeCompare(pats[b].dir) || pats[b].trips - pats[a].trips);
  // Branches with the same headsign get "via" their first stop the other
  // branches don't have (route 36: via Lamar or via Kimball).
  const via = pats.map((p, i) => {
    const others = pats.filter((q, j) => j !== i && q.head === p.head);
    if (!others.length) return "";
    const theirs = new Set(others.flatMap(q => q.stops.map(s => s[0])));
    return p.stops.find(s => !theirs.has(s[0]))?.[1] ?? "";
  });
  $("strips").innerHTML = order.map(i => strip(pats[i], placed[i], W, via[i])).join("");
  $("off").textContent = off.length ? "Not placed on a stop pattern: " + off.map(v =>
    `${TROLLEY.has(route) ? "trolley" : "bus"} ${v.equipment_no ?? v.vehicle_id} (${(v.destination ?? "").trim() || "no destination"})`).join(", ") : "";
}

function strip(p, buses, W, via) {
  const st = p.stops, LX = W < 420 ? 125 : 190, y = (pos) => TOP + pos * ROW;
  let H = y(st.length - 1) + TOP;
  let svg = `<line x1="${LX}" x2="${LX}" y1="${y(0)}" y2="${y(st.length - 1)}" stroke="var(--ink-2)" stroke-width="4" stroke-linecap="round"/>`;
  st.forEach((s, k) => {
    const tp = s[5] || k === 0 || k === st.length - 1;
    svg += tp
      ? `<circle cx="${LX}" cy="${y(k)}" r="7" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`
      : `<circle cx="${LX}" cy="${y(k)}" r="4" fill="var(--surface)" stroke="var(--ink-2)" stroke-width="2"/>`;
    svg += `<text class="${tp ? "tp" : "stop"}" x="${LX + 16}" y="${y(k) + 5.5}"><title>${esc(s[1])} (${esc(s[0])})</title>${esc(s[1])}</text>`;
  });
  // Buses, top to bottom; labels pushed down so they never overlap, with a
  // leader line when a label had to move off its bus.
  buses.sort((a, b) => a.pos - b.pos);
  let labelFloor = -Infinity, marks = "", labels = "";
  buses.forEach((b, i) => {
    const v = b.v, by = y(b.pos), t = tier(v), ghost = v.unchanged_polls >= GHOST_POLLS;
    marks += ghost
      ? `<circle cx="${LX}" cy="${by}" r="10" fill="var(--surface)" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/>`
      : `<circle cx="${LX}" cy="${by}" r="10" fill="var(--${t})" stroke="var(--surface)" stroke-width="2.5"/>` +
        `<path d="M${LX - 4},${by - 2} L${LX + 4},${by - 2} L${LX},${by + 4} Z" fill="${t === "late5" ? "#0b0b0b" : "#fff"}"/>`;
    // Travel is downward, so the bus ahead is the next one down the strip;
    // the gap to it is in scheduled running minutes.
    const lead = buses[i + 1];
    const gap = lead ? Math.round((offsetAt(p, lead.pos) - offsetAt(p, b.pos)) / 60) : null;
    const ly = Math.max(by - 10, labelFloor);
    const who = `${TROLLEY.has(v.route_id) ? "trolley" : "bus"} ${v.equipment_no ?? v.vehicle_id}`;
    labels += `<text class="lab" x="${LX - 20}" y="${ly + 5}" text-anchor="end">${esc(delayText(v))}</text>` +
      `<text class="lab2" x="${LX - 20}" y="${ly + 24}" text-anchor="end">${esc(who)}</text>` +
      (gap != null ? `<text class="lab2" x="${LX - 20}" y="${ly + 43}" text-anchor="end">${gap} min gap &#8595;</text>` : "");
    if (Math.abs(ly - (by - 10)) > 2)
      labels += `<line x1="${LX - 16}" y1="${ly}" x2="${LX - 11}" y2="${by}" stroke="var(--muted)" stroke-width="1"/>`;
    labelFloor = ly + (gap != null ? 58 : 40);
    H = Math.max(H, labelFloor);
  });
  const mins = Math.round(st.at(-1)[4] / 60);
  return `<section class="col"><h2>to ${esc(p.head)}${via ? ` <span class="muted">via ${esc(via)}</span>` : ""}</h2>
    <div class="muted">${st.length} stops &middot; ~${mins} min end to end &middot; ${buses.length} ${buses.length === 1 ? "bus" : "buses"}</div>
    <svg width="${W}" height="${H}" role="img" aria-label="Route strip to ${esc(p.head)} with ${buses.length} live buses">${svg}${labels}${marks}</svg></section>`;
}
</script>
</body>
</html>
