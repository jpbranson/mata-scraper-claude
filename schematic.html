<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATA schematic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="pages.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  #top { margin: 14px 14px 0; position: relative; z-index: 1001; }
  #map { flex: 1; margin: 10px 0 var(--bar-room); background: var(--surface); }
  .leaflet-container { background: var(--surface); font: 16px Inter, system-ui, sans-serif; }
  .leaflet-tooltip { background: var(--surface); color: var(--ink); border: none; border-radius: 8px;
    box-shadow: 0 0 0 1px var(--ring), 0 2px 10px rgba(0,0,0,.15); padding: 6px 10px;
    font: 16px/1.35 Inter, system-ui, sans-serif; }
  .leaflet-tooltip::before { display: none; }
  .leaflet-tooltip.label { background: none; box-shadow: none; padding: 0 4px; font-weight: 600;
    text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface), 0 0 3px var(--surface); }
  .leaflet-control-attribution { font-size: 16px; }
  .bus, .term { background: none; border: none; }
  .bus svg { overflow: visible; }
  .bus text { font: 600 16px Inter, system-ui, sans-serif; text-anchor: middle; }
  .term span { display: inline-block; white-space: nowrap; font-weight: 600; font-size: 16px;
    color: var(--ink); background: var(--surface); border: 1.5px solid var(--hairline); border-radius: 6px; padding: 0 5px; }
  #legend { position: absolute; left: 14px; bottom: calc(var(--bar-room) + 14px); z-index: 1000; padding: 10px 14px; color: var(--ink-2); }
  #legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend i { width: 13px; height: 13px; border-radius: 50%; flex: none; }
  @media (max-width: 720px) { #legend { display: none; } }
</style>
</head>
<body>
<header id="top" class="panel">
  <nav><a href="map.html">Map</a><a href="strips.html">Strips</a><a href="schematic.html" class="on">Schematic</a></nav>
  <div class="chips" id="routes" style="flex-basis: 100%"></div>
</header>
<div id="map"></div>
<div id="legend" class="panel">
  <div><i style="background:var(--early)"></i>early</div>
  <div><i style="background:var(--ontime)"></i>on time</div>
  <div><i style="background:var(--late5)"></i>5+ min late</div>
  <div><i style="background:var(--late10)"></i>10+ min late</div>
  <div><i style="background:var(--late20)"></i>20+ min late</div>
  <div><i style="background:var(--surface);border:2.5px solid var(--ink);width:9px;height:9px"></i>major stop</div>
  <div><i style="width:24px;height:10px;border-radius:5px;background:var(--ink);opacity:.35"></i>band width = % full</div>
  <div>click a line or route to pick it out</div>
</div>
<div id="bar" class="panel"></div>
<script src="transit.js"></script>
<script>
// The whole network as a subway-style map, from schematic.json (built by
// build_schematic.py with LOOM): stations are the timetable's major stops,
// every segment is at 45°/90°, and routes sharing a street run as parallel
// lanes in the order LOOM chose to minimise crossings. Lines are neutral so
// color stays with the buses' delay. Buses slide along their own lane
// between the major stops before and after them, by scheduled time. Lanes
// keep a fixed pixel spacing, so the geometry is recomputed on zoom. How
// full a bus is shows as a translucent band along that stretch of its lane,
// wider the fuller it is, drawn under the lines so bundles stay readable.
// The bar at the bottom replays any recorded moment, as on the map.
// Lane spacing and line width in pixels; halved when zoomed far out (a
// phone's whole-network view), where full-size bundles swamp the map.
const small = () => map.getZoom() < -2.5;
const lanePx = () => small() ? 2.5 : 5, weightPx = () => small() ? 1.8 : 3.2;
const pt = (p) => [-p[1], p[0]];                  // schematic units (y down) -> CRS.Simple
const map = L.map("map", { crs: L.CRS.Simple, preferCanvas: true, zoomControl: false,
  minZoom: -4, maxZoom: 3, zoomSnap: .25, attributionControl: true });
map.attributionControl.setPrefix("").addAttribution("Layout: LOOM, University of Freiburg");
L.control.zoom({ position: "bottomright" }).addTo(map);
map.createPane("buses").style.zIndex = 650;
map.createPane("loads").style.zIndex = 350;       // under the lines (overlay pane, 400)
map.getPane("loads").style.pointerEvents = "none";
// Load band: the lane's width plus up to LOAD_PX more at 100% full.
const LOAD_PX = () => small() ? 12 : 32;

let S = null, focus = null, latest = null, routes = [];
const lineLayers = [], labels = [], busMarkers = {}, loadBands = [];
let lanes = [];                                    // lanes[edge][route] = offset polyline (units)
let width = [];                                    // widest bundle (lanes) through each node
const radius = (i) => small() ? Math.min(width[i] * lanePx() / 2 + 1.5, 6) : Math.min(width[i] * lanePx() / 2 + 3, 13);

// --- Geometry ---------------------------------------------------------------
function offsetLine(pts, d) {
  if (!d) return pts;
  const nrm = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; };
  return pts.map((p, i) => {
    const n1 = i > 0 ? nrm(pts[i - 1], p) : null, n2 = i < pts.length - 1 ? nrm(p, pts[i + 1]) : null;
    let [nx, ny] = n1 && n2 ? [n1[0] + n2[0], n1[1] + n2[1]] : (n1 ?? n2), k = 1;
    const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    if (n1 && n2) k = 1 / Math.max(nx * n1[0] + ny * n1[1], .5);   // miter, capped
    return [p[0] + nx * d * k, p[1] + ny * d * k];
  });
}
function along(pts, f) {
  const seg = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
  let want = Math.max(0, Math.min(1, f)) * seg.reduce((a, b) => a + b, 0);
  for (let i = 0; i < seg.length; i++) {
    if (want <= seg[i] || i === seg.length - 1) {
      const t = seg[i] ? Math.min(want / seg[i], 1) : 0;
      return [pts[i][0] + t * (pts[i + 1][0] - pts[i][0]), pts[i][1] + t * (pts[i + 1][1] - pts[i][1])];
    }
    want -= seg[i];
  }
  return pts[0];
}

// --- Network ----------------------------------------------------------------
getJSON("schematic.json", "no-cache").then(s => {
  if (!s) { $("routes").textContent = "schematic.json is missing (run build_schematic.py)."; return; }
  S = s;
  fit();
  drawNetwork();
  drawLabels();
  map.on("zoomend", () => { drawNetwork(); drawLabels(); drawBuses(); });
  map.on("click", () => setFocus(null));
  drawBuses();
});

// Whole network in view. Called again once the route chips have given the
// header its final height, unless the viewer has already moved the map.
let moved = false;
map.on("dragstart zoomstart", (e) => { if (e.hard !== false && fitting === 0) moved = true; });
let fitting = 0;
function fit() {
  if (!S || moved) return;
  map.invalidateSize();
  const xs = S.nodes.map(n => n[0]), ys = S.nodes.map(n => n[1]);
  fitting++;
  map.fitBounds([pt([Math.min(...xs), Math.max(...ys)]), pt([Math.max(...xs), Math.min(...ys)])], { padding: [20, 20], animate: false });
  fitting--;
}

function drawNetwork() {
  for (const l of lineLayers) map.removeLayer(l);
  lineLayers.length = 0;
  const unit = 1 / map.getZoomScale(map.getZoom(), 0);   // schematic units per pixel
  lanes = S.edges.map(([a, b, pts, lns]) => {
    const out = {};
    lns.forEach((r, i) => out[r] = offsetLine(pts, (i - (lns.length - 1) / 2) * lanePx() * unit));
    return out;
  });
  S.edges.forEach((e, ei) => {
    for (const r of e[3]) {
      const on = !focus || focus === r;
      const l = L.polyline(lanes[ei][r].map(pt), { color: css(focus === r ? "--focus" : "--ink-2"),
        weight: weightPx() + (focus === r ? 1 : 0), opacity: on ? .95 : .18, lineCap: "butt", lineJoin: "miter" })
        .bindTooltip(`route ${esc(r)}`, { sticky: true })
        .on("click", (ev) => { L.DomEvent.stop(ev); setFocus(focus === r ? null : r); })
        .addTo(map);
      l.route = r;
      if (focus === r) l.bringToFront();
      lineLayers.push(l);
    }
  });
  // Stations over the lines, sized to the widest bundle through them.
  width = S.nodes.map(() => 1);
  for (const [a, b, , lns] of S.edges) { width[a] = Math.max(width[a], lns.length); width[b] = Math.max(width[b], lns.length); }
  S.nodes.forEach((n, i) => {
    if (!n[2]) return;
    const served = focus && S.edges.some(e => (e[0] === i || e[1] === i) && e[3].includes(focus));
    const l = L.circleMarker(pt(n), { radius: radius(i), color: css("--ink"), weight: small() ? 1.5 : 2.5,
      fillColor: css("--surface"), fillOpacity: 1, opacity: !focus || served ? 1 : .3 })
      .bindTooltip(esc(stationName(n)), { direction: "top", offset: [0, -6] }).addTo(map);
    lineLayers.push(l);
  });
}

// Names: the four transit centers at overview zoom, every station from zoom 0 in,
// each to the right of its station or else the left, and dropped if both
// would overlap a label or station already placed (hubs and big junctions
// first). Route numbers at each route's ends, except at transit centers.
const HUB_NAMES = { "2": "William Hudson Transit Center", WHTC: "William Hudson Transit Center",
  WHTCTRLY: "William Hudson Transit Center", CENTRSTA: "Central Station",
  "3206": "Airways Transit Center", "3": "American Way Transit Center" };
const HUBS = new Set(Object.keys(HUB_NAMES));
const stationName = (n) => HUB_NAMES[n[2]] ?? n[3];
function drawLabels() {
  for (const l of labels) map.removeLayer(l);
  labels.length = 0;
  const all = map.getZoom() >= 0, taken = [], dots = [];
  const over = (b, list) => list.some(t => b[0] < t[2] && b[2] > t[0] && b[1] < t[3] && b[3] > t[1]);
  const stations = S.nodes.map((n, i) => ({ n, i, p: map.latLngToContainerPoint(pt(n)) })).filter(s => s.n[2]);
  for (const { i, p } of stations) { const r = radius(i); dots.push([p.x - r, p.y - r, p.x + r, p.y + r]); }
  // Zoomed far out (a phone's whole-network view) there's no room for
  // names at all; they appear as you zoom in, and tapping a station names it.
  stations.filter(s => !small() && (all || HUBS.has(s.n[2])))
    .sort((a, b) => (HUBS.has(b.n[2]) - HUBS.has(a.n[2])) || width[b.i] - width[a.i])
    .forEach(({ n, i, p }) => {
      // Transit centers must be named: they may cover stations (not other
      // labels) and also try above and below.
      const hub = HUBS.has(n[2]), name = stationName(n), w = name.length * 10.5 + 8, h = 22, gap = radius(i) + 4;
      const boxes = { right: [p.x + gap, p.y - h / 2], left: [p.x - gap - w, p.y - h / 2],
        top: [p.x - w / 2, p.y - gap - h], bottom: [p.x - w / 2, p.y + gap] };
      const offs = { right: [gap - 6, 0], left: [6 - gap, 0], top: [0, 6 - gap], bottom: [0, gap - 6] };
      for (const side of hub ? ["right", "left", "top", "bottom"] : ["right", "left"]) {
        const [x0, y0] = boxes[side], box = [x0, y0, x0 + w, y0 + h];
        if (over(box, taken) || (!hub && over(box, dots))) continue;
        taken.push(box);
        labels.push(L.tooltip({ permanent: true, direction: side, offset: offs[side],
          className: "label", interactive: false }).setLatLng(pt(n)).setContent(esc(name)).addTo(map));
        break;
      }
    });
  if (map.getZoom() < -2.5) return;        // phone-sized overview: too crowded
  const ends = {};
  S.edges.forEach(([a, b, , lns]) => { for (const r of lns) for (const n of [a, b]) (ends[n] ??= {})[r] = (ends[n]?.[r] ?? 0) + 1; });
  for (const n in ends) {
    const rs = Object.keys(ends[n]).filter(r => ends[n][r] === 1);
    if (!rs.length || HUBS.has(S.nodes[n][2])) continue;
    labels.push(L.marker(pt(S.nodes[n]), { interactive: false, icon: L.divIcon({ className: "term",
      iconSize: [0, 0], iconAnchor: [-10, 26], html: `<span>${rs.sort((a, b) => +a - +b).map(esc).join(" · ")}</span>` }) }).addTo(map));
  }
}

function setFocus(r) {
  focus = r;
  if (r && location.hash !== "#" + r) history.replaceState(null, "", "#" + r);
  if (!r) history.replaceState(null, "", location.pathname);
  drawNetwork(); drawBuses(); drawChips();
}
focus = location.hash.slice(1) || null;

// --- Chips ------------------------------------------------------------------
fetch("routes.csv", { cache: "no-cache" }).then(r => r.text()).then(t => {
  routes = t.trim().split("\n").slice(1).map(l => l.split(",")).map(c => ({ id: c[1], name: c[2] }))
    .sort((a, b) => +a.id - +b.id);
  drawChips();
  if (S) { fit(); drawNetwork(); drawLabels(); drawBuses(); }
});
function drawChips() {
  const count = {};
  for (const v of latest?.vehicles ?? []) count[v.route_id] = (count[v.route_id] ?? 0) + 1;
  $("routes").innerHTML = routes.map(r =>
    `<button class="chip${r.id === focus ? " on" : ""}" data-r="${esc(r.id)}" title="${esc(r.name)}">${esc(r.id)}<small>${count[r.id] ?? 0}</small></button>`).join("");
  for (const b of $("routes").children) b.onclick = () => setFocus(focus === b.dataset.r ? null : b.dataset.r);
}

// --- Buses ------------------------------------------------------------------
timeline(async (snap) => {
  latest = snap;
  // Only the routes with buses out; each file once per day.
  await Promise.all([...new Set(snap.vehicles.map(v => v.route_id))].map(r => routeFile(snap.day, r)));
  if (latest !== snap) return;          // a newer moment arrived meanwhile
  drawChips(); drawBuses();
});

// A bus's place on the schematic: between the major stops before and after
// it on its pattern, along its route's lane, by scheduled time. { ll, leg }:
// leg is that stretch of lane (map coordinates), or null at a station.
async function place(v) {
  const file = await routeFile(latest.day, v.route_id), pats = file?.patterns;
  const at = pats?.length && locate(v, pats);
  if (!at) return null;
  const p = pats[at.pat], st = p.stops, last = st.length - 1;
  const major = (k) => st[k][5] || k === 0 || k === last;
  let a = Math.min(Math.floor(at.pos), last), b = a + 1;
  while (a > 0 && !major(a)) a--;
  while (b < last && !major(b)) b++;
  const station = (k) => S.stations[st[k][0]];
  const atStation = () => station(a) != null ? { ll: pt(S.nodes[station(a)]), leg: null } : null;
  if (b > last) return atStation();
  const leg = S.legs[v.route_id]?.[`${st[a][0]}>${st[b][0]}`];
  if (!leg?.length) return atStation();
  const pts = [];
  for (const [ei, dir] of leg) {
    const lane = lanes[ei][v.route_id];
    pts.push(...(dir > 0 ? lane : [...lane].reverse()));
  }
  const f = (offsetAt(p, at.pos) - st[a][4]) / ((st[b][4] - st[a][4]) || 1);
  return { ll: pt(along(pts, f)), leg: pts.map(pt) };
}

function icon(v) {
  const ghost = v.unchanged_polls >= GHOST_POLLS, t = tier(v), fill = css("--" + t);
  const r = v.route_id.length > 2 ? 16 : 13, trolley = TROLLEY.has(v.route_id), e = trolley ? r + 6 : r, box = e + 4;
  const outline = ghost ? `fill="${css("--surface")}" stroke="${css("--muted")}" stroke-width="2" stroke-dasharray="4 3"`
    : `fill="${fill}" stroke="${css("--surface")}" stroke-width="2.5"`;
  const shape = trolley ? `<path d="M0,${-e} L${e},0 L0,${e} L${-e},0 Z" stroke-linejoin="round" ${outline}/>` : `<circle r="${r}" ${outline}/>`;
  const ink = ghost ? css("--muted") : t === "late5" ? "#0b0b0b" : "#fff";
  return L.divIcon({ className: "bus", iconSize: [box * 2, box * 2], iconAnchor: [box, box],
    html: `<svg width="${box * 2}" height="${box * 2}" viewBox="${-box} ${-box} ${box * 2} ${box * 2}">${shape}<text y="5.5" fill="${ink}">${esc(v.route_id)}</text></svg>` });
}
let drawing = 0;
async function drawBuses() {
  if (!S || !latest) return;
  const token = ++drawing, seen = new Set();
  const spots = await Promise.all(latest.vehicles.map(place));
  if (token !== drawing) return;
  for (const l of loadBands) map.removeLayer(l);
  loadBands.length = 0;
  latest.vehicles.forEach((v, i) => {
    if (!spots[i]) return;
    const { ll, leg } = spots[i], load = v.occupancy_pct;
    seen.add(v.vehicle_id);
    // Its stretch of lane, as wide as it is full; not for a bus whose GPS
    // has stuck (its load is as stale as its position) or another route
    // than the one picked out.
    if (leg && load > 0 && v.unchanged_polls < GHOST_POLLS && (!focus || focus === v.route_id))
      loadBands.push(L.polyline(leg, { pane: "loads", interactive: false, color: css("--ink"), opacity: .35,
        weight: weightPx() + Math.min(load, 100) / 100 * LOAD_PX(), lineCap: "round", lineJoin: "round" }).addTo(map));
    const full = load == null ? "" : ` &middot; ${load}% full`;
    const tipText = `<b>${esc(v.route_id)}</b> ${esc((v.destination ?? "").trim())}<br>${esc(delayText(v))}${full}` +
      (v.equipment_no ? `<br><small>${TROLLEY.has(v.route_id) ? "trolley" : "bus"} ${esc(v.equipment_no)}</small>` : "");
    const m = busMarkers[v.vehicle_id] ??= L.marker(ll, { pane: "buses" })
      .bindTooltip("", { direction: "top", offset: [0, -16] })
      .on("click", (ev) => { L.DomEvent.stop(ev); setFocus(focus === m.route ? null : m.route); })
      .addTo(map);
    m.route = v.route_id;
    m.setLatLng(ll).setIcon(icon(v)).setTooltipContent(tipText)
      .setOpacity(!focus || focus === v.route_id ? 1 : .25)
      .setZIndexOffset(focus === v.route_id ? 1000 : 0);
  });
  for (const id in busMarkers) if (!seen.has(id)) { map.removeLayer(busMarkers[id]); delete busMarkers[id]; }
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S) { drawNetwork(); drawBuses(); } });
</script>
</body>
</html>
