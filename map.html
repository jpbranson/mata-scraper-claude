<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATA live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --hairline: #a9a8a1; --ring: rgba(11,11,11,.10);
    --early: #2a78d6; --ontime: #898781; --late5: #fab219; --late10: #ec835a; --late20: #d03b3b;
    --focus: #2a78d6; --stop: #6f6e69;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --hairline: #4a4a47; --ring: rgba(255,255,255,.10);
    --early: #3987e5; --focus: #3987e5; --stop: #d6d5cc;
  } }
  /* Minimum text size anywhere on the page is 12 pt = 16 px. */
  html, body, #map { height: 100%; margin: 0; background: var(--surface);
    font: 16px/1.35 Inter, system-ui, sans-serif; color: var(--ink); }
  .panel { position: absolute; z-index: 1000; background: var(--surface); color: var(--ink);
    border-radius: 10px; box-shadow: 0 0 0 1px var(--ring), 0 2px 10px rgba(0,0,0,.15); }
  #stats { top: 14px; right: 14px; display: flex; gap: 24px; padding: 12px 18px; }
  #stats b { display: block; font-size: 34px; font-weight: 600; line-height: 1.1; }
  #stats span { color: var(--muted); }
  #legend { bottom: 92px; left: 14px; padding: 12px 16px; color: var(--ink-2); }
  #legend div { display: flex; align-items: center; gap: 9px; margin: 4px 0; }
  #legend i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  #legend .sz i { background: var(--muted); }
  #legend .ghost i { background: none; border: 2px dashed var(--muted); }
  #legend .stop i { width: 8px; height: 8px; background: var(--surface); border: 2px solid var(--stop); }
  #legend .hub i { border-radius: 3px; background: var(--surface); border: 3px solid var(--ink); width: 10px; height: 10px; }
  #legend .garage i { border-radius: 3px; background: var(--ink); }
  #legend .links { margin-top: 8px; }
  #legend a { color: var(--focus); font-weight: 600; }
  #legend .trolley i { border-radius: 2px; background: var(--muted); width: 11px; height: 11px;
    transform: rotate(45deg); margin: 0 1.5px; }
  .place { background: none; border: none; }

  /* Stop panel: per route, the last and next scheduled trips at the stop. */
  #stop { top: 124px; right: 14px; width: 380px; max-height: calc(100% - 214px); overflow: auto;
    padding: 12px 16px 14px; }
  #stop[hidden] { display: none; }
  #stop h2 { font-size: 18px; font-weight: 600; margin: 0 36px 2px 0; }
  #stop-x { position: absolute; top: 8px; right: 8px; font: 600 20px Inter, system-ui, sans-serif;
    color: var(--ink-2); background: none; border: none; cursor: pointer; width: 36px; height: 36px; }
  #stop .rt { margin-top: 14px; }
  #stop .rt > div { display: flex; align-items: baseline; gap: 8px; color: var(--ink-2); }
  #stop .chip { font-weight: 600; color: #fff; background: var(--focus); border-radius: 6px;
    padding: 0 7px; flex: none; }
  #stop table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  #stop th { font-weight: 400; color: var(--muted); text-align: left; padding: 2px 0; }
  #stop td { padding: 3px 0; }
  #stop td:last-child, #stop th:last-child { text-align: right; }
  #stop tr.now td { border-top: 1.5px solid var(--focus); padding: 0; height: 0; }
  #stop .past { color: var(--ink-2); }
  #stop .muted, #stop small { color: var(--muted); font-size: 16px; }
  #stop h2 .chip { margin-right: 6px; }
  #stop .sub { color: var(--ink-2); margin-bottom: 4px; }
  #stop .sub a { color: var(--focus); }
  #stop h3 { font-size: 16px; font-weight: 600; margin: 14px 0 0; }
  #stop td small { display: block; }
  #stop .chart { position: relative; margin-top: 6px; }
  #stop .chart svg { display: block; overflow: visible; touch-action: none; }
  #stop .chart text { font: 16px Inter, system-ui, sans-serif; fill: var(--muted); }
  #stop .chart .tip { position: absolute; top: 0; pointer-events: none; background: var(--surface);
    border-radius: 6px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0,0,0,.15);
    padding: 2px 8px; white-space: nowrap; }
  #stop .chart .tip b { font-weight: 600; }
  #stop .badge { display: inline-block; min-width: 3.2em; text-align: center; border-radius: 6px;
    padding: 0 6px; font-weight: 600; color: #fff; }

  /* Timeline: play/pause, scrubber, clock, speed, LIVE, day. */
  #bar { bottom: 14px; left: 14px; right: 14px; display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
  #bar button { font: 600 16px Inter, system-ui, sans-serif; color: var(--ink); background: none;
    border: 1.5px solid var(--hairline); border-radius: 8px; padding: 6px 12px; cursor: pointer; min-width: 44px; }
  #bar button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  #live.on { background: var(--late20); border-color: var(--late20); color: #fff; }
  #bar input[type=range] { flex: 1; accent-color: var(--focus); min-width: 80px; }
  #bar input[type=date] { font: 16px Inter, system-ui, sans-serif; color: var(--ink); background: none;
    border: 1.5px solid var(--hairline); border-radius: 8px; padding: 5px 8px; }
  #clock { min-width: 5.5em; text-align: center; font-variant-numeric: tabular-nums; display: flex;
    align-items: center; justify-content: center; gap: 6px; }
  #clock i { width: 9px; height: 9px; border-radius: 50%; background: #0ca30c; display: none; }
  #clock.live i { display: block; }
  #clock.stale i { background: var(--late20); }

  .leaflet-trails-pane canvas { pointer-events: none !important; }
  .bus { background: none; border: none; }
  .bus svg { overflow: visible; }
  .bus text { font: 600 16px Inter, system-ui, sans-serif; text-anchor: middle; }
  .leaflet-tooltip { background: var(--surface); color: var(--ink); border: none; border-radius: 8px;
    box-shadow: 0 0 0 1px var(--ring), 0 2px 10px rgba(0,0,0,.15); padding: 8px 12px;
    font: 16px/1.35 Inter, system-ui, sans-serif; }
  .leaflet-tooltip::before { display: none; }
  .leaflet-tooltip b { font-weight: 600; }
  .leaflet-tooltip small { font-size: 16px; color: var(--muted); }
  .leaflet-container { background: var(--surface); font: 16px Inter, system-ui, sans-serif; }
  .leaflet-control-attribution { font-size: 16px; }
  .leaflet-bottom.leaflet-right { bottom: 78px; }
  /* Phones: scrubber on its own row, legend tucked up out of the bar's way. */
  @media (max-width: 720px) {
    #bar { flex-wrap: wrap; gap: 10px; }
    #bar input[type=range] { flex: 1 1 100%; order: -1; }
    #legend { bottom: 172px; }
    #stop { top: 14px; left: 14px; right: 14px; width: auto; max-height: 55vh; }
    body.stop-open #legend { display: none; }
    .leaflet-bottom.leaflet-right { bottom: 158px; }
  }
  .leaflet-tile-pane { filter: grayscale(1) contrast(.85) opacity(.7); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-tile-pane {
    filter: invert(1) grayscale(1) brightness(.75) contrast(1.1); } }
</style>
</head>
<body>
<div id="map"></div>
<div id="stats" class="panel">
  <div><b id="n-bus">–</b><span>buses</span></div>
  <div><b id="n-late">–</b><span>late 5+ min</span></div>
  <div><b id="n-ride">–</b><span>riders (est.)</span></div>
</div>
<div id="legend" class="panel">
  <div><i style="background:var(--early)"></i>early</div>
  <div><i style="background:var(--ontime)"></i>on time</div>
  <div><i style="background:var(--late5)"></i>5+ min late</div>
  <div><i style="background:var(--late10)"></i>10+ min late</div>
  <div><i style="background:var(--late20)"></i>20+ min late</div>
  <div class="sz"><i style="width:10px;height:10px"></i><i style="width:18px;height:18px"></i>&nbsp;size = load</div>
  <div class="trolley"><i></i>trolley (route 100)</div>
  <div class="ghost"><i></i>no GPS movement</div>
  <div class="stop"><i></i>stop (click for times)</div>
  <div class="hub"><i></i>transit center</div>
  <div class="garage"><i></i>bus garage / trolley barn</div>
  <div class="links"><a href="strips.html">Route strips</a> &middot; <a href="schematic.html">Schematic</a></div>
</div>
<div id="stop" class="panel" hidden>
  <button id="stop-x" title="close">&times;</button>
  <h2 id="stop-name"></h2>
  <div id="stop-body"></div>
</div>
<div id="bar" class="panel">
  <button id="play" title="play / pause">&#9654;</button>
  <input id="scrub" type="range" min="0" max="0" value="0">
  <div id="clock"><i></i><span id="clock-t">–</span></div>
  <button id="speed" title="replay speed">60&times;</button>
  <button id="live" title="back to live">LIVE</button>
  <input id="day" type="date">
</div>
<script>
// Data: data/latest.json every 10 s (live, each bus with its recent trail),
// data/replay/<day>.jsonl once per day viewed (one frame per 30 s, written by
// cadavl_to_gtfs_rt.py), network.geojson once (routes + stops, from
// build_crosswalk.py), and on clicking a stop that day's data/schedule/ and
// data/arrivals/ files (schedule.py). Serve the repo root over HTTP —
// fetch() won't work over file://.
// CAPACITY: the vendor's load % is riders out of 50 on every vehicle (it only
// ever moves in steps of 2), so this turns it back into a count.
const POLL_MS = 10000, FRAME_S = 30, TRAIL_S = 300, GHOST_POLLS = 30, CAPACITY = 50;
// Clock times read in Memphis time wherever the viewer is, like the timetable.
const TZ = "America/Chicago";
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const dark = matchMedia("(prefers-color-scheme: dark)");
const $ = (id) => document.getElementById(id);

const map = L.map("map", { preferCanvas: true, zoomControl: false }).setView([35.12, -89.97], 12);
L.control.zoom({ position: "bottomright" }).addTo(map);
// Trails get their own pane so they always paint above the network and stops
// (overlay pane is z 400, markers 600). Its canvas spans the whole map, so
// it must let clicks and hovers through to the stops underneath.
const trailPane = map.createPane("trails");
trailPane.style.zIndex = 450;
trailPane.style.pointerEvents = "none";
// OSM tiles, muted by CSS (see .leaflet-tile-pane) so the data reads on top.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors" }).addTo(map);

// --- Places: garages and transit centers ----------------------------------
// Garages from MATA's published addresses (located on OpenStreetMap);
// transit centers where MATA's timetable ends the trips headed to them, with
// the stop codes whose times their panel shows (William Hudson has three:
// main bays, a second bay, the trolley platform). Squares, so they don't
// read as stops or buses; buses paint over them.
const PLACES = [
  { kind: "garage", name: "Bus garage", note: "1370 Levee Rd &middot; operations center", ll: [35.17919, -90.01324] },
  { kind: "garage", name: "Trolley barn", note: "547 N Main St", ll: [35.15966, -90.04761] },
  { kind: "hub", name: "William Hudson Transit Center", ll: [35.15655, -90.0477], codes: ["2", "WHTC", "WHTCTRLY"] },
  { kind: "hub", name: "Central Station", ll: [35.13193, -90.05903], codes: ["CENTRSTA"] },
  { kind: "hub", name: "Airways Transit Center", ll: [35.06178, -89.99283], codes: ["3206"] },
  { kind: "hub", name: "American Way Transit Center", ll: [35.07598, -89.93267], codes: ["3"] },
];
map.createPane("places").style.zIndex = 590;
for (const pl of PLACES) {
  const sq = pl.kind === "hub"
    ? `<rect x="-9" y="-9" width="18" height="18" rx="3" style="fill:var(--surface);stroke:var(--ink);stroke-width:3.5"/>`
    : `<rect x="-10" y="-10" width="20" height="20" rx="3" style="fill:var(--ink);stroke:var(--surface);stroke-width:2"/>`;
  L.marker(pl.ll, { pane: "places", zIndexOffset: pl.kind === "hub" ? 10 : 0,
    icon: L.divIcon({ className: "place", iconSize: [28, 28], iconAnchor: [14, 14],
      html: `<svg width="28" height="28" viewBox="-14 -14 28 28">${sq}</svg>` }) })
    .bindTooltip(`<b>${pl.name}</b><br><small>${pl.note ?? "click for times"}</small>`,
      { direction: "top", offset: [0, -12], opacity: 1 })
    .on("click", (e) => { L.DomEvent.stop(e); if (pl.codes) showStop({ stop: pl.name, codes: pl.codes }, pl.ll); })
    .addTo(map);
}

// --- Delay tiers -----------------------------------------------------------
function tier(v) {
  const d = v.delay_seconds;
  if (d == null) return "ontime";
  // "1h+" values are floors, early or late. Pollers before the parse fix
  // stored them as 0, direction unknown: grey.
  if (v.delay_capped) return d > 0 ? "late20" : d < 0 ? "early" : "ontime";
  if (d >= 1200) return "late20";
  if (d >= 600) return "late10";
  if (d >= 300) return "late5";
  if (d <= -60) return "early";
  return "ontime";
}
const RANK = { ontime: 0, early: 1, late5: 2, late10: 3, late20: 4 };
function delayText(v) {
  const d = v.delay_seconds;
  if (v.delay_raw) return v.delay_raw;
  if (d == null) return "no delay data";
  if (v.delay_capped) return d < 0 ? "1h+ early" : d > 0 ? "1h+ late" : "1h+ off schedule";
  const m = Math.round(Math.abs(d) / 60);
  return m === 0 ? "on time" : `${m} min ${d < 0 ? "early" : "late"}`;
}

// --- Network: route lines + stops ------------------------------------------
// focus: route numbers highlighted (a clicked bus's route, or every route
// at a clicked stop); everything else dims.
let routes = null, stops = null, focus = new Set(), stopMark = null;
const stopName = {};           // stop code -> name as the tracker spells it
const routeStyle = (f) => focus.has(f.properties.route_id)
  ? { color: css("--focus"), weight: 6, opacity: .9 }
  : { color: css("--hairline"), weight: 2, opacity: focus.size ? .3 : .8 };
// Stops only from zoom 13 in; city-wide they would just dot over the routes.
const STOP_ZOOM = 13;
const stopStyle = () => ({ radius: map.getZoom() >= 15 ? 5.5 : 4, color: css("--stop"),
  weight: 2, fillColor: css("--surface"), fillOpacity: 1, opacity: 1 });
// no-cache: revalidate every load. The poller rebuilds this file when MATA
// renumbers, and a stale cached copy lacks the stop codes the panel needs.
fetch("network.geojson", { cache: "no-cache" }).then(r => r.json()).then(gj => {
  routes = L.geoJSON(gj, { filter: f => f.geometry.type !== "Point", style: routeStyle,
    interactive: false }).addTo(map);
  for (const f of gj.features) if (f.geometry.type === "Point") stopName[f.properties.code] = f.properties.stop;
  stops = L.geoJSON(gj, { filter: f => f.geometry.type === "Point",
    pointToLayer: (f, ll) => L.circleMarker(ll, stopStyle())
      .bindTooltip(f.properties.stop, { direction: "top", offset: [0, -6], opacity: 1 })
      .on("click", (e) => { L.DomEvent.stop(e); showStop(f.properties, ll); }) });
  routes.bringToBack();
  restyle();
});
function restyle() {
  if (routes) {
    routes.setStyle(routeStyle);
    // Highlighted lines paint over the hairlines that share their streets.
    routes.eachLayer(l => { if (focus.has(l.feature.properties.route_id)) l.bringToFront(); });
  }
  if (stopMark) stopMark.setStyle({ color: css("--focus") });
  if (!stops) return;
  stops.setStyle(stopStyle());
  if (map.getZoom() >= STOP_ZOOM) { if (!map.hasLayer(stops)) stops.addTo(map); stops.bringToFront(); }
  else if (map.hasLayer(stops)) map.removeLayer(stops);
}
map.on("zoomend", restyle);
map.on("click", () => { closePanel(); setFocus([]); });
dark.addEventListener("change", () => { restyle(); draw(); });
function setFocus(ids) {
  focus = new Set(ids);
  restyle(); draw();
}
// Clicking a bus opens its panel and highlights its route; clicking it
// again (or the map) clears both.
function clickBus(id) {
  if (busOpen === id) { closePanel(); setFocus([]); return; }
  const v = current()?.v.find(x => x.vehicle_id === id);
  closePanel();
  busOpen = id;
  openPanel();
  setFocus(v ? [v.route_id] : []);
  if (v) reveal([v.lat, v.lon]);
}

// --- Timeline --------------------------------------------------------------
// frames: the viewed day's snapshots, oldest first, one per FRAME_S.
// cursor: index into frames while replaying, or null when live.
let frames = [], cursor = null, live = null, playing = false, speed = 60, ticker = null;
const SPEEDS = [10, 60, 300];
// The poller's local service day (from latest.json), which names today's
// replay file — not the viewer's clock, which may be in another time zone.
let serverDay = null;
const today = () => serverDay;

// Frames from before 2026-09-25 stop at unchanged_polls.
const fromLine = (line) => { const f = JSON.parse(line); return { t: f.t, v: f.v.map(a => ({
  vehicle_id: a[0], route_id: a[1], lat: a[2], lon: a[3], bearing: a[4], delay_seconds: a[5],
  delay_capped: a[6], occupancy_pct: a[7], unchanged_polls: a[8], destination: a[9],
  next_stop_name: a[10], equipment_no: a[11] })) }; };

async function loadDay(day) {
  const r = await fetch(`data/replay/${day}.jsonl`, { cache: "no-store" });
  const loaded = r.ok ? (await r.text()).split("\n").filter(Boolean).map(fromLine) : [];
  if ($("day").value !== day) return;          // another day was picked meanwhile
  frames = loaded;
  $("scrub").max = Math.max(frames.length - 1, 0);
}
function current() { return cursor == null ? live : frames[cursor]; }
// Positions per bus over the TRAIL_S before frame `f` (plus f itself). Live,
// the poller sends each bus's last ten in latest.json, so trails are whole
// the moment the page opens; replaying, they come from the frames.
function trailsAt(f) {
  const out = {};
  if (cursor == null && f.v.some(v => v.trail)) {
    for (const v of f.v) out[v.vehicle_id] = [...(v.trail ?? []), [v.lat, v.lon]];
    return out;
  }
  const end = cursor == null ? frames.length : cursor;
  for (let i = end - 1; i >= 0 && f.t - frames[i].t <= TRAIL_S; i--)
    for (const v of frames[i].v) (out[v.vehicle_id] ??= []).unshift([v.lat, v.lon]);
  for (const v of f.v) (out[v.vehicle_id] ??= []).push([v.lat, v.lon]);
  return out;
}

function setCursor(i) {
  cursor = Math.max(0, Math.min(i, frames.length - 1));
  if (!frames.length) cursor = null;
  draw();
}
function goLive() {
  playing = false; clearInterval(ticker); cursor = null;
  if ($("day").value !== today()) { $("day").value = today(); loadDay(today()).then(draw); }
  draw();
}
function play(on) {
  playing = on; clearInterval(ticker);
  if (!on) return draw();
  if (cursor == null) cursor = Math.max(frames.length - 1, 0);
  ticker = setInterval(() => {
    if (cursor >= frames.length - 1) {
      if ($("day").value === today()) return goLive();
      return play(false);
    }
    setCursor(cursor + 1);
  }, FRAME_S * 1000 / speed);
  draw();
}
$("play").onclick = () => play(!playing);
$("scrub").oninput = (e) => setCursor(+e.target.value);
$("speed").onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  $("speed").innerHTML = speed + "&times;"; if (playing) play(true); };
$("live").onclick = goLive;
$("day").onchange = async (e) => { playing = false; clearInterval(ticker);
  await loadDay(e.target.value); cursor = frames.length ? 0 : null; draw(); };

// --- Drawing ---------------------------------------------------------------
const markers = {}, trails = {};
// The trolley line is drawn as a diamond so it doesn't pass for a bus (the
// vendor calls every vehicle "Bus"; only the route tells them apart).
const TROLLEY = new Set(["100"]);
function icon(v) {
  const ghost = v.unchanged_polls >= GHOST_POLLS;
  const t = tier(v), fill = css("--" + t);
  // Big enough for 16 px digits; grows with passenger load.
  const r = (v.route_id.length > 2 ? 16 : 13) + 6 * Math.min(v.occupancy_pct ?? 0, 100) / 100;
  const trolley = TROLLEY.has(v.route_id), edge = trolley ? r + 6 : r;
  const box = edge + 10;
  const textColor = t === "late5" ? "#0b0b0b" : "#fff";
  const wedge = (!ghost && v.bearing != null)
    ? `<path d="M0,${-edge - 9} L6,${-edge - 1} L-6,${-edge - 1} Z" fill="${fill}" transform="rotate(${v.bearing})"/>` : "";
  const outline = ghost ? `fill="${css("--surface")}" stroke="${css("--muted")}" stroke-width="2" stroke-dasharray="4 3"`
    : `fill="${fill}" stroke="${css("--surface")}" stroke-width="2.5"`;
  const circle = trolley
    ? `<path d="M0,${-edge} L${edge},0 L0,${edge} L${-edge},0 Z" stroke-linejoin="round" ${outline}/>`
    : `<circle r="${r}" ${outline}/>`;
  return L.divIcon({ className: "bus", iconSize: [box * 2, box * 2], iconAnchor: [box, box],
    html: `<svg width="${box * 2}" height="${box * 2}" viewBox="${-box} ${-box} ${box * 2} ${box * 2}">
      ${wedge}${circle}<text y="5.5" fill="${ghost ? css("--muted") : textColor}">${v.route_id}</text></svg>` });
}
function tip(v) {
  const load = v.occupancy_pct == null ? "" : ` &middot; ${v.occupancy_pct}% full`;
  const ghost = v.unchanged_polls >= GHOST_POLLS ? `<br><small>no GPS movement for ${Math.round(v.unchanged_polls * POLL_MS / 60000)} min</small>` : "";
  const bus = v.equipment_no ? `<br><small>${TROLLEY.has(v.route_id) ? "trolley" : "bus"} ${v.equipment_no}</small>` : "";
  return `<b>${v.route_id}</b> ${v.destination ?? ""}<br>${delayText(v)}${load}${bus}${ghost}`;
}
// Trail: one segment per pair of positions. Newest is bright and solid,
// oldest is darkened and faint.
const shade = (hex, k) => "#" + [1, 3, 5].map(i =>
  Math.round(parseInt(hex.slice(i, i + 2), 16) * k).toString(16).padStart(2, "0")).join("");
function drawTrail(group, pts, hex, dim) {
  group.clearLayers();
  const n = pts.length - 1;
  for (let i = 0; i < n; i++) {
    const age = 1 - (i + 1) / n;                 // 0 = newest, 1 = oldest
    group.addLayer(L.polyline([pts[i], pts[i + 1]], {
      color: shade(hex, 1 - .6 * age), weight: 5 - 2.5 * age,
      opacity: (.95 - .8 * age) * dim, lineCap: "round", interactive: false, pane: "trails" }));
  }
}

function draw() {
  const f = current();
  const seen = new Set();
  let late = 0, riders = 0;
  if (f) {
    const tr = trailsAt(f);
    for (const v of f.v) {
      seen.add(v.vehicle_id);
      const t = tier(v), pos = [v.lat, v.lon];
      if (RANK[t] >= 2) late++;
      if (v.occupancy_pct != null) riders += v.occupancy_pct / 100 * CAPACITY;

      const m = markers[v.vehicle_id] ??= L.marker(pos, { icon: icon(v) })
        .bindTooltip("", { direction: "top", offset: [0, -20], opacity: 1 })
        .on("click", (e) => { L.DomEvent.stop(e); clickBus(m.vehicleId); })
        .addTo(map);
      m.vehicleId = v.vehicle_id;
      const dim = !focus.size || focus.has(v.route_id) ? 1 : .3;
      m.setLatLng(pos).setIcon(icon(v)).setZIndexOffset(RANK[t] * 1000 + (dim < 1 ? -5000 : 0))
        .setOpacity(dim).setTooltipContent(tip(v));

      const pts = tr[v.vehicle_id] ?? [];
      if (pts.length > 1) drawTrail(trails[v.vehicle_id] ??= L.layerGroup().addTo(map), pts, css("--" + t), dim);
      else if (trails[v.vehicle_id]) trails[v.vehicle_id].clearLayers();
      if (v.vehicle_id === busOpen) busRing.setLatLng(pos).addTo(map);
    }
  }
  if (busOpen && !seen.has(busOpen)) map.removeLayer(busRing);
  for (const id in markers) if (!seen.has(id)) {
    map.removeLayer(markers[id]); delete markers[id];
    if (trails[id]) { map.removeLayer(trails[id]); delete trails[id]; }
  }

  $("n-bus").textContent = f ? f.v.length : "–";
  $("n-late").textContent = f ? late : "–";
  $("n-ride").textContent = f ? "~" + Math.round(riders) : "–";
  $("clock-t").textContent = f ? new Date(f.t * 1000).toLocaleTimeString([], { timeStyle: "short", timeZone: TZ }) : "–";
  $("clock").classList.toggle("live", cursor == null);
  $("clock").classList.toggle("stale", cursor == null && !!f && Date.now() / 1000 - f.t > 90);
  $("play").innerHTML = playing ? "&#10074;&#10074;" : "&#9654;";
  $("play").classList.toggle("on", playing);
  $("live").classList.toggle("on", cursor == null);
  $("scrub").value = cursor == null ? frames.length - 1 : cursor;
  $("scrub").max = Math.max(frames.length - 1, 0);
  renderPanel();
}

// --- Info panel: a stop or a bus -------------------------------------------
// Stop: per route serving it, the last SHOW and next SHOW scheduled trips,
// each with when its bus actually came or, live, when it's expected
// (scheduled + the bus's current delay). Bus: its last SHOW stops (scheduled
// vs actual) and next SHOW (scheduled vs expected), and its delay over the
// last CHART_H hours. The timetable is data/schedule/<day>/ and the arrivals
// data/arrivals/<day>/, both written by the poller (schedule.py); trips tie
// them together, and to live buses. The delay history is the replay frames.
const SHOW = 3, ARRIVALS_TTL = 30000, CHART_H = 4, RECENT_S = 5400;
let stopOpen = null, busOpen = null, panelRender = 0, busRing = null;
const got = {};                // url -> { until, data } or { pending }
// Fetch and parse, reusing the result for `ttl` ms (schedules are fixed for
// the day). A missing file is retried after ARRIVALS_TTL: the poller may
// not have written it yet.
async function cached(url, ttl, lines) {
  const c = got[url];
  if (c?.pending) return c.pending;
  if (c && Date.now() < c.until) return c.data;
  const pending = fetch(url, { cache: "no-store" })
    .then(r => !r.ok ? null : lines
      ? r.text().then(t => t.split("\n").filter(Boolean).map(l => JSON.parse(l))) : r.json())
    .catch(() => null);
  got[url] = { pending };
  const data = await pending;
  got[url] = { until: Date.now() + (data == null ? ARRIVALS_TTL : ttl), data };
  return data;
}
const hm = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", timeZone: TZ });
const esc = (x) => String(x ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function badge(sec) {
  const m = Math.round(sec / 60), t = tier({ delay_seconds: sec });
  return `<span class="badge" style="background:var(--${t});${t === "late5" ? "color:#0b0b0b" : ""}">${m > 0 ? "+" : ""}${m === 0 ? "0" : m}</span>`;
}

function openPanel() {
  $("stop-name").textContent = "";
  $("stop-body").innerHTML = `<p class="muted">Loading…</p>`;
  $("stop").hidden = false;
  document.body.classList.add("stop-open");
  busRing ??= L.circleMarker([0, 0], { pane: "trails", radius: 30, weight: 3, fill: false, interactive: false });
  busRing.setStyle({ color: css("--focus") });
}
// On phones the panel covers the top of the map; if the clicked bus or stop
// is under it, slide the map so it sits in the clear area below.
function reveal(ll) {
  if (innerWidth > 720 || !ll) return;
  // The panel's full height (max-height 55vh), not its height while loading.
  const under = 14 + innerHeight * .55, h = map.getSize().y;
  const y = map.latLngToContainerPoint(ll).y, want = under + (h - 180 - under) / 2;
  if (y < under + 30) map.panBy([0, y - want], { animate: false });
}
function closePanel() {
  stopOpen = busOpen = null;
  $("stop").hidden = true;
  document.body.classList.remove("stop-open");
  if (stopMark) map.removeLayer(stopMark);
  if (busRing) map.removeLayer(busRing);
}
$("stop-x").onclick = () => { closePanel(); setFocus([]); };
function renderPanel() {
  if (stopOpen) renderStop();
  else if (busOpen) renderBus();
}

// p: a stop feature's properties ({stop, code}) or a transit center's
// {stop, codes}.
async function showStop(props, ll) {
  closePanel();
  const p = stopOpen = { name: props.stop, codes: props.codes ?? (props.code ? [props.code] : []) };
  openPanel();
  (stopMark ??= L.circleMarker(ll, { radius: 11, weight: 3, fill: false, interactive: false }))
    .setLatLng(ll).addTo(map);
  $("stop-name").textContent = p.name;
  reveal(ll);
  const idx = await cached(`data/schedule/${$("day").value}/stops.json`, Infinity);
  if (stopOpen === p) setFocus(p.codes.flatMap(c => idx?.stops[c] ?? []));
}

async function renderStop() {
  const p = stopOpen, token = ++panelRender, day = $("day").value, f = current();
  if (!p.codes.length) {
    $("stop-body").innerHTML = `<p class="muted">This map's stop list is out of date. Reload the page.</p>`;
    return;
  }
  const now = f ? f.t : Date.now() / 1000;
  const idx = await cached(`data/schedule/${day}/stops.json`, Infinity);
  const here = [...new Set(p.codes.flatMap(c => idx?.stops[c] ?? []))].sort();
  // Live buses by the trip they're running (none when replaying).
  const onTrip = {};
  if (cursor == null && live) for (const v of live.v) if (v.trip_id) onTrip[v.trip_id] = v;
  const parts = await Promise.all(here.map(async (route) => {
    const [sch, arr] = await Promise.all([
      cached(`data/schedule/${day}/${route}.json`, Infinity),
      cached(`data/arrivals/${day}/${route}.jsonl`, ARRIVALS_TTL, true)]);
    if (!sch) return `<div class="rt"><div><span class="chip">${route}</span><span class="muted">timetable file missing</span></div></div>`;
    const came = {}, rows = [];
    for (const a of arr ?? []) if (p.codes.includes(a.stop) && a.t <= now) {
      if (a.trip) came[a.trip + " " + a.stop] = a; else rows.push({ at: a.t, past: true });
    }
    const heads = new Set();
    for (const c of p.codes) for (const [s, i] of sch.stops[c] ?? []) {
      const [trip, head] = sch.trips[i], due = sch.t0 + s, a = came[trip + " " + c], v = onTrip[trip];
      heads.add(head.trim());
      if (a) rows.push({ due, at: a.t, past: true });
      else if (v && v.delay_seconds != null) rows.push({ due, at: Math.max(due + v.delay_seconds, now), expected: true });
      else rows.push({ due, past: due < now });
    }
    const when = (r) => r.at ?? r.due;
    rows.sort((a, b) => when(a) - when(b));
    const past = rows.filter(r => r.past).slice(-SHOW), next = rows.filter(r => !r.past).slice(0, SHOW);
    const td = (r) => `<td>${r.due ? hm(r.due) : "<small>unscheduled</small>"}</td>` +
      (r.at == null ? `<td class="muted">${r.past ? "not seen" : ""}</td><td></td>`
        : `<td>${r.expected ? "~" : ""}${hm(r.at)}</td><td>${r.due ? badge(r.at - r.due) : ""}</td>`);
    return `<div class="rt"><div><span class="chip">${route}</span><span>to ${esc([...heads].join(" / "))}</span></div>
      <table><tr><th>Scheduled</th><th>Arrived / expected</th><th>min</th></tr>
      ${past.map(r => `<tr class="past">${td(r)}</tr>`).join("")}
      <tr class="now"><td colspan="3"></td></tr>
      ${next.map(r => `<tr>${td(r)}</tr>`).join("") || `<tr><td colspan="3" class="muted">no more trips today</td></tr>`}
      </table></div>`;
  }));
  if (token !== panelRender || stopOpen !== p) return;   // a newer render won
  $("stop-body").innerHTML = parts.join("") ||
    `<p class="muted">${idx ? "No scheduled service here on this day." : "No timetable for this day yet."}</p>`;
}

// Each trip's calls in order, [[seconds after t0, stop code], ...], and trip
// id -> index; built once per route file.
function tripIndex(sch) {
  if (sch.calls) return sch;
  sch.calls = sch.trips.map(() => []);
  for (const code in sch.stops) for (const [s, i] of sch.stops[code]) sch.calls[i].push([s, code]);
  for (const c of sch.calls) c.sort((a, b) => a[0] - b[0]);
  sch.byTrip = Object.fromEntries(sch.trips.map(([trip], i) => [trip, i]));
  return sch;
}

async function renderBus() {
  const id = busOpen, token = ++panelRender, day = $("day").value, f = current();
  const v = f?.v.find(x => x.vehicle_id === id);
  if (!v) {
    $("stop-name").textContent = "Bus";
    $("stop-body").innerHTML = `<p class="muted">Not in service at this moment.</p>`;
    return;
  }
  const now = f.t, route = v.route_id;
  const [sch0, arr] = await Promise.all([
    cached(`data/schedule/${day}/${route}.json`, Infinity),
    cached(`data/arrivals/${day}/${route}.jsonl`, ARRIVALS_TTL, true)]);
  if (token !== panelRender || busOpen !== id) return;
  const sch = sch0 && tripIndex(sch0);
  // A trip's scheduled time at a stop; if it calls there twice (loops),
  // the call nearest the time it actually came.
  const dueAt = (trip, code, near) => {
    const i = sch?.byTrip[trip];
    if (i == null) return null;
    const cs = sch.calls[i].filter(([, cd]) => cd === code).map(([s]) => sch.t0 + s);
    return cs.length ? cs.reduce((a, b) => Math.abs(b - near) < Math.abs(a - near) ? b : a) : null;
  };
  // Last SHOW stops this bus served on its current route, within the last
  // 90 min (older ones mean a gap in logging, not where it's been).
  const mine = (arr ?? []).filter(a => a.vehicle === id && a.t <= now && a.t > now - RECENT_S);
  const prior = mine.slice(-SHOW).map(a => ({ code: a.stop, at: a.t, due: a.trip ? dueAt(a.trip, a.stop, a.t - (a.delay ?? 0)) : null }));
  // Its trip: live, the poller's match; replaying, its latest arrival's.
  const trip = v.trip_id ?? mine.at(-1)?.trip;
  const ti = sch && trip ? sch.byTrip[trip] : null, calls = ti == null ? [] : sch.calls[ti];
  const delay = v.delay_seconds != null && !v.delay_capped ? v.delay_seconds : null;
  // Where it is on that trip: live, its next stop by name (the call nearest
  // in time if the name repeats); otherwise just past its latest arrival.
  let k = -1;
  if (v.next_stop_name) {
    let best = Infinity;
    calls.forEach(([s, code], j) => {
      if (stopName[code] !== v.next_stop_name) return;
      const off = Math.abs(sch.t0 + s + (delay ?? 0) - now);
      if (off < best) { best = off; k = j; }
    });
  }
  if (k < 0 && mine.length && mine.at(-1).trip === trip) {
    const last = mine.at(-1), j = calls.findIndex(([s, code]) => code === last.stop);
    if (j >= 0) k = j + 1;
  }
  const next = k < 0 ? [] : calls.slice(k, k + SHOW).map(([s, code]) => {
    const due = sch.t0 + s;
    return { code, due, at: delay == null ? null : Math.max(due + delay, now), expected: true };
  });

  const head = v.destination?.trim() || (ti != null ? sch.trips[ti][1].trim() : "");
  $("stop-name").innerHTML = `<span class="chip">${esc(route)}</span>${head ? "to " + esc(head) : ""}`;
  // Fleet number (painted on the bus) and the tracker's own vehicle ID,
  // which is what the history files and replay frames key on.
  const facts = [v.equipment_no && `${TROLLEY.has(route) ? "trolley" : "bus"} ${esc(v.equipment_no)}`,
    `ID ${esc(v.vehicle_id)}`, esc(delayText(v)), v.occupancy_pct != null && `${v.occupancy_pct}% full`,
    `<a href="strips.html#${encodeURIComponent(route)}">route strip</a>`].filter(Boolean);
  const row = (r, cls) => `<tr class="${cls}"><td>${esc(stopName[r.code] ?? r.code)}` +
    `<small class="muted">${r.due ? "sched " + hm(r.due) : "unscheduled"}</small></td>` +
    `<td>${r.at == null ? "" : (r.expected ? "~" : "") + hm(r.at)}</td>` +
    `<td>${r.at != null && r.due ? badge(r.at - r.due) : ""}</td></tr>`;
  const html = `<div class="sub">${facts.join(" &middot; ")}</div>
    <table><tr><th>Stop</th><th>Arrived / expected</th><th>min</th></tr>
    ${prior.map(r => row(r, "past")).join("") || `<tr><td colspan="3" class="muted">no stops recorded yet</td></tr>`}
    <tr class="now"><td colspan="3"></td></tr>
    ${next.map(r => row(r, "")).join("") || `<tr><td colspan="3" class="muted">${sch ? "next stops unknown" : "no timetable for this day"}</td></tr>`}
    </table>
    <h3>Delay, last ${CHART_H} hours</h3><div class="chart"></div>`;
  $("stop-body").innerHTML = html;
  delayChart($("stop-body").querySelector(".chart"), id, now);
}

// Minutes late over the last CHART_H hours, from the replay frames: one 2 px
// line in the delay-tier colors (above 0 = late, below = early), guides at
// 0 and the tier thresholds, and a crosshair that snaps to the nearest
// reading. "1h+" readings are floors, not values: left as gaps. Some buses
// run two routes in turn (MATA's timetable gives them one block, e.g. 13
// and 40): each switch gets a vertical line and each route's stretch its
// number along the top, and the line breaks there, since the delay is
// measured against a different trip on either side.
function delayChart(el, id, now) {
  const from = now - CHART_H * 3600, pts = [];
  const reading = (v) => ({ r: v.route_id, d: v.delay_capped || v.delay_seconds == null ? null : v.delay_seconds / 60 });
  for (const fr of frames) {
    if (fr.t < from || fr.t > now) continue;
    const v = fr.v.find(x => x.vehicle_id === id);
    if (v) pts.push({ t: fr.t, ...reading(v) });
  }
  const cur = current()?.v.find(x => x.vehicle_id === id);
  if (cur && (!pts.length || pts.at(-1).t < now)) pts.push({ t: now, ...reading(cur) });
  const vals = pts.filter(p => p.d != null).map(p => p.d);
  if (!vals.length) { el.innerHTML = `<p class="muted">No delay readings yet.</p>`; return; }
  // Stretches on one route, oldest first.
  const runs = [];
  for (const p of pts) if (p.r !== runs.at(-1)?.r) runs.push({ r: p.r, t: p.t });
  const switched = runs.length > 1;
  // Rows logged before routes.csv caught up carry `cadavl:<line id>`.
  const named = (r) => r.startsWith("cadavl:") ? "line " + r.slice(7) : "route " + r;

  const W = Math.max(el.clientWidth, 240), H = switched ? 170 : 150, L0 = 38, B = 24, T = switched ? 30 : 10;
  const lo = Math.min(-5, Math.floor(Math.min(...vals))), hi = Math.max(10, Math.ceil(Math.max(...vals)));
  const x = (t) => L0 + (t - from) / (now - from) * (W - L0 - 4);
  const y = (d) => T + (hi - d) / (hi - lo) * (H - T - B);
  // Guides: 0 solid, thresholds dashed, labels kept 18 px apart.
  let guides = "", lastY = -99;
  for (const g of [hi, 20, 10, 5, 0, -5, lo].filter((g, i, a) => g <= hi && g >= lo && a.indexOf(g) === i).sort((a, b) => b - a)) {
    const gy = y(g), label = Math.abs(gy - lastY) >= 18 || g === 0;
    if (g === 0 || [5, 10, 20].includes(g))
      guides += `<line x1="${L0}" x2="${W - 4}" y1="${gy}" y2="${gy}" stroke="var(--${g === 0 ? "muted" : "hairline"})" stroke-width="1" ${g ? 'stroke-dasharray="3 4"' : ""}/>`;
    if (label) { guides += `<text x="${L0 - 6}" y="${gy + 5}" text-anchor="end">${g > 0 ? "+" + g : g}</text>`; lastY = gy; }
  }
  // Route switches: a line up through the label strip, and each stretch's
  // route number where it fits (~9 px a character at 16 px). Newest first:
  // the current route always gets its label, flush right if its stretch is
  // too short, and older labels give way to it.
  let marks = "", room = W - 4;
  const text = (tx, s, end) => `<text x="${tx}" y="19"${end ? ' text-anchor="end"' : ""} style="fill:var(--ink-2);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:5px">${esc(s)}</text>`;
  if (switched) for (let i = runs.length - 1; i >= 0; i--) {
    const x0 = Math.max(x(runs[i].t), L0), x1 = Math.min(i + 1 < runs.length ? x(runs[i + 1].t) : W - 4, room);
    if (i) marks += `<line x1="${x0}" x2="${x0}" y1="4" y2="${H - B}" stroke="var(--muted)" stroke-width="1.5"/>`;
    const names = [named(runs[i].r), runs[i].r.replace(/^cadavl:/, "")], w = (s) => s.length * 9 + 10;
    const label = names.find(s => w(s) <= x1 - x0);
    if (label) { marks += text(x0 + 5, label, false); room = x0 - 4; }
    else if (i === runs.length - 1) { marks += text(W - 4, names[0], true); room = W - 4 - w(names[0]); }
  }
  // The line, split where the tier or route changes or readings stop (gap > 3 min).
  let lines = "", seg = [], segTier = null;
  const flush = () => { if (seg.length > 1) lines += `<polyline points="${seg.join(" ")}" fill="none" stroke="var(--${segTier})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`; };
  pts.forEach((p, i) => {
    const prev = pts[i - 1];
    if (p.d == null || (prev && (p.t - prev.t > 180 || p.r !== prev.r))) { flush(); seg = []; segTier = null; if (p.d == null) return; }
    const t = tier({ delay_seconds: p.d * 60 }), pt = `${x(p.t).toFixed(1)},${y(p.d).toFixed(1)}`;
    if (t !== segTier) { flush(); seg = seg.length ? [seg.at(-1)] : []; segTier = t; }
    seg.push(pt);
  });
  flush();
  const via = switched ? `, on ${runs.map(u => named(u.r)).join(" then ")}` : "";
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Delay over the last ${CHART_H} hours${esc(via)}, now ${esc(cur ? delayText(cur) : "")}">
    ${guides}${marks}${lines}
    <text x="${L0}" y="${H - 4}">${hm(from)}</text><text x="${W - 4}" y="${H - 4}" text-anchor="end">${hm(now)}</text>
    <line class="xh" y1="${T}" y2="${H - B}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>
    <circle class="dot" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>
    <rect x="${L0}" y="0" width="${W - L0}" height="${H - B}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector("svg"), xh = svg.querySelector(".xh"), dot = svg.querySelector(".dot"), tipEl = el.querySelector(".tip");
  const shown = pts.filter(p => p.d != null);
  const hover = (e) => {
    const mx = e.clientX - svg.getBoundingClientRect().left;
    const p = shown.reduce((a, b) => Math.abs(x(b.t) - mx) < Math.abs(x(a.t) - mx) ? b : a);
    const px = x(p.t), m = Math.round(p.d);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    dot.setAttribute("cx", px); dot.setAttribute("cy", y(p.d)); dot.setAttribute("visibility", "visible");
    tipEl.hidden = false;
    tipEl.innerHTML = "<b></b> <span class=\"muted\"></span>";
    tipEl.firstChild.textContent = m === 0 ? "on time" : `${Math.abs(m)} min ${m < 0 ? "early" : "late"}`;
    tipEl.lastChild.textContent = hm(p.t) + (switched ? " · " + named(p.r) : "");
    tipEl.style.left = Math.min(Math.max(px - tipEl.offsetWidth / 2, 0), W - tipEl.offsetWidth) + "px";
    tipEl.style.top = "-34px";
  };
  svg.addEventListener("pointermove", hover);
  svg.addEventListener("pointerdown", hover);
  svg.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tipEl.hidden = true; });
}

// --- Live ------------------------------------------------------------------
async function refresh() {
  const resp = await fetch("data/latest.json", { cache: "no-store" });
  const j = await resp.json(), fetched_at = j.fetched_at, vehicles = j.vehicles;
  // Older pollers don't report their day; fall back to the viewer's date.
  const day = j.day ?? new Date(fetched_at * 1000).toLocaleDateString("en-CA");
  live = { t: fetched_at, v: vehicles };
  // First load, or the service day rolled over while watching live: load
  // that day's frames.
  // The replay file can be several MB by evening; the live view (trails
  // included) doesn't wait for it.
  if (day !== serverDay && (serverDay == null || cursor == null)) {
    serverDay = day; $("day").value = day; frames = [];
    loadDay(day).then(() => { if (cursor == null) draw(); });
  }
  // Extend today's timeline at the file's cadence so trails keep growing
  // between page loads and the scrubber reaches "now".
  if ($("day").value === today() && (!frames.length || fetched_at - frames.at(-1).t >= FRAME_S - 5)
      && (!frames.length || fetched_at > frames.at(-1).t))
    frames.push(live);
  if (cursor == null) draw();
}

refresh().catch(console.error);
setInterval(() => refresh().catch(console.error), POLL_MS);
</script>
</body>
</html>
