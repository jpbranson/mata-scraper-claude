<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MATA live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --hairline: #a9a8a1; --ring: rgba(11,11,11,.10);
    --early: #2a78d6; --ontime: #898781; --late5: #fab219; --late10: #ec835a; --late20: #d03b3b;
    --focus: #2a78d6;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --hairline: #4a4a47; --ring: rgba(255,255,255,.10);
    --early: #3987e5; --focus: #3987e5;
  } }
  html, body, #map { height: 100%; margin: 0; background: var(--surface);
    font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  .panel { position: absolute; z-index: 1000; background: var(--surface); color: var(--ink);
    border-radius: 8px; box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0,0,0,.15); }
  #stats { top: 12px; right: 12px; display: flex; gap: 18px; padding: 10px 14px; }
  #stats b { display: block; font-size: 26px; font-weight: 600; line-height: 1; }
  #stats span { font-size: 11px; color: var(--muted); }
  #clock { position: absolute; top: 70px; right: 12px; z-index: 1000; font-size: 11px; color: var(--muted);
    display: flex; align-items: center; gap: 5px; }
  #clock i { width: 7px; height: 7px; border-radius: 50%; background: #0ca30c; }
  #clock.stale i { background: var(--late20); }
  #legend { bottom: 24px; left: 12px; padding: 10px 12px; font-size: 11px; color: var(--ink-2); }
  #legend div { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  #legend i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  #legend .sz { display: flex; align-items: center; gap: 4px; }
  #legend .sz i { background: var(--muted); }
  #legend .ghost i { background: none; border: 1.5px dashed var(--muted); }
  .bus { background: none; border: none; }
  .bus svg { overflow: visible; }
  .bus text { font: 600 10px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
  .leaflet-tooltip { background: var(--surface); color: var(--ink); border: none; border-radius: 6px;
    box-shadow: 0 0 0 1px var(--ring), 0 2px 8px rgba(0,0,0,.15); padding: 6px 9px; line-height: 1.35; }
  .leaflet-tooltip::before { display: none; }
  .leaflet-tooltip b { font-size: 13px; }
  .leaflet-tooltip small { color: var(--muted); }
  .leaflet-container { background: var(--surface); }
  .leaflet-tile-pane { filter: grayscale(1) contrast(.85) opacity(.7); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .leaflet-tile-pane {
    filter: invert(1) grayscale(1) brightness(.75) contrast(1.1); } }
</style>
</head>
<body>
<div id="map"></div>
<div id="stats" class="panel">
  <div><b id="n-bus">–</b><span>buses</span></div>
  <div><b id="n-late">–</b><span>late 5+ min</span></div>
  <div><b id="n-ride">–</b><span>riders (est.)</span></div>
</div>
<div id="clock"><i></i><span id="clock-t"></span></div>
<div id="legend" class="panel">
  <div><i style="background:var(--early)"></i>early</div>
  <div><i style="background:var(--ontime)"></i>on time</div>
  <div><i style="background:var(--late5)"></i>5+ min late</div>
  <div><i style="background:var(--late10)"></i>10+ min late</div>
  <div><i style="background:var(--late20)"></i>20+ min late</div>
  <div class="sz"><i style="width:8px;height:8px"></i><i style="width:15px;height:15px"></i>&nbsp;size = load</div>
  <div class="ghost"><i></i>no GPS movement</div>
</div>
<script>
// Reads data/latest.json (written by cadavl_to_gtfs_rt.py every poll) and
// shapes.geojson (built by build_crosswalk.py). Serve the repo root over
// HTTP — fetch() won't work over file://.
const POLL_MS = 10000, GHOST_POLLS = 30, CAPACITY = 40;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const dark = matchMedia("(prefers-color-scheme: dark)");

const map = L.map("map", { preferCanvas: true, zoomControl: false }).setView([35.12, -89.97], 12);
L.control.zoom({ position: "bottomright" }).addTo(map);
// OSM tiles, muted by CSS (see .leaflet-tile-pane) so the data reads on top.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
function theme() { if (network) network.setStyle(routeStyle); }
dark.addEventListener("change", theme);

// --- Delay tiers -----------------------------------------------------------
function tier(v) {
  const d = v.delay_seconds;
  if (d == null) return "ontime";
  if (v.delay_capped || d >= 1200) return "late20";
  if (d >= 600) return "late10";
  if (d >= 300) return "late5";
  if (d <= -60) return "early";
  return "ontime";
}
const RANK = { ontime: 0, early: 1, late5: 2, late10: 3, late20: 4 };

// --- Network ---------------------------------------------------------------
let network = null, focusRoute = null;
const routeStyle = (f) => f.properties.route_id === focusRoute
  ? { color: css("--focus"), weight: 5, opacity: .9 }
  : { color: css("--hairline"), weight: 2, opacity: focusRoute ? .35 : .8 };
fetch("shapes.geojson").then(r => r.json()).then(gj => {
  network = L.geoJSON(gj, { style: routeStyle, interactive: false }).addTo(map);
  network.bringToBack();
});
map.on("click", () => setFocus(null));
function setFocus(routeId) {
  focusRoute = routeId === focusRoute ? null : routeId;
  if (network) network.setStyle(routeStyle);
}
theme();

// --- Buses -----------------------------------------------------------------
const markers = {}, trails = {};
function icon(v) {
  const ghost = v.unchanged_polls >= GHOST_POLLS;
  const t = tier(v), fill = css("--" + t);
  const r = 9 + 7 * Math.min(v.occupancy_pct ?? 0, 100) / 100;
  const box = r + 8;
  const textColor = t === "late5" ? "#0b0b0b" : "#fff";
  const wedge = (!ghost && v.bearing != null)
    ? `<path d="M0,${-r - 7} L4.5,${-r - 1} L-4.5,${-r - 1} Z" fill="${fill}" transform="rotate(${v.bearing})"/>` : "";
  const circle = ghost
    ? `<circle r="${r}" fill="${css("--surface")}" stroke="${css("--muted")}" stroke-width="1.5" stroke-dasharray="3 2"/>`
    : `<circle r="${r}" fill="${fill}" stroke="${css("--surface")}" stroke-width="2"/>`;
  return L.divIcon({ className: "bus", iconSize: [box * 2, box * 2], iconAnchor: [box, box],
    html: `<svg width="${box * 2}" height="${box * 2}" viewBox="${-box} ${-box} ${box * 2} ${box * 2}">
      ${wedge}${circle}<text y="3.5" fill="${ghost ? css("--muted") : textColor}"
        ${v.route_id.length > 2 ? 'font-size="8.5"' : ""}>${v.route_id}</text></svg>` });
}
function tip(v) {
  const load = v.occupancy_pct == null ? "" : ` &middot; ${v.occupancy_pct}% full`;
  const ghost = v.unchanged_polls >= GHOST_POLLS ? `<br><small>no GPS movement for ${Math.round(v.unchanged_polls * POLL_MS / 60000)} min</small>` : "";
  return `<b>${v.route_id}</b> ${v.destination ?? ""}<br>${v.delay_raw ?? "no delay data"}${load}<br><small>bus ${v.equipment_no}</small>${ghost}`;
}

async function refresh() {
  const resp = await fetch("data/latest.json", { cache: "no-store" });
  const { fetched_at, vehicles } = await resp.json();
  const seen = new Set();
  let late = 0, riders = 0;

  for (const v of vehicles) {
    seen.add(v.vehicle_id);
    const t = tier(v), pos = [v.lat, v.lon];
    if (RANK[t] >= 2) late++;
    if (v.occupancy_pct != null) riders += v.occupancy_pct / 100 * CAPACITY;

    const m = markers[v.vehicle_id] ??= L.marker(pos, { icon: icon(v) })
      .bindTooltip("", { direction: "top", offset: [0, -14], opacity: 1 })
      .on("click", (e) => { L.DomEvent.stop(e); setFocus(m.routeId); })
      .addTo(map);
    m.routeId = v.route_id;
    m.setLatLng(pos).setIcon(icon(v)).setZIndexOffset(RANK[t] * 1000).setTooltipContent(tip(v));

    const pts = v.trail ?? [];
    if (pts.length > 1) {
      const style = { color: css("--" + t), weight: 3, opacity: .35, interactive: false };
      const tr = trails[v.vehicle_id] ??= L.polyline(pts, style).addTo(map);
      tr.setLatLngs(pts).setStyle(style);
    }
  }
  for (const id in markers) if (!seen.has(id)) {
    map.removeLayer(markers[id]); delete markers[id];
    if (trails[id]) { map.removeLayer(trails[id]); delete trails[id]; }
  }

  document.getElementById("n-bus").textContent = vehicles.length;
  document.getElementById("n-late").textContent = late;
  document.getElementById("n-ride").textContent = "~" + Math.round(riders);
  document.getElementById("clock-t").textContent = new Date(fetched_at * 1000).toLocaleTimeString([], { timeStyle: "short" });
  document.getElementById("clock").classList.toggle("stale", Date.now() / 1000 - fetched_at > 90);
}

refresh().catch(console.error);
setInterval(() => refresh().catch(console.error), POLL_MS);
</script>
</body>
</html>
